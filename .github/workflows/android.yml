name: Android beta
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assemblePilot assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: digiticket-unsigned-release
          path: android/app/build/outputs/apk/pilot/*-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-packages
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 3
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-packages
          path: packages
      - name: Enable emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Test on clean Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install packages/debug/app-debug.apk
            adb install packages/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r mx.digiticket.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-result.txt
            grep -Eq '^OK \([1-9][0-9]* tests?\)' instrument-result.txt
